name = "shopnix-api"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[vars]
STORE_NAME = "Shopnix"
WHATSAPP_NUMBER = "+380 676235211"
TELEGRAM_USERNAME = "@Shop_nix"

[[d1_databases]]
binding = "DB"
database_name = "shopnix-db"
database_id = "b962c82e-6ff7-406f-84e7-7052f3ed67a9"
migrations_dir = "migrations"

# Optional image storage:
# [[r2_buckets]]
# binding = "IMAGES"
# bucket_name = "shopnix-images"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
