name = "shopnix-api"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[vars]
STORE_NAME = "Shopnix"
WHATSAPP_NUMBER = ""
TELEGRAM_USERNAME = ""

[[d1_databases]]
binding = "DB"
database_name = "shopnix-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

# Optional image storage:
# [[r2_buckets]]
# binding = "IMAGES"
# bucket_name = "shopnix-images"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
